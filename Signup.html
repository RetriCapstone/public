<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container-navigation">
            <div class="logo-container">
                <img src="/teacher/images/logo1.png" alt="landing-logo">
            </div>
        </div>
    </header>
    <div class="login-container">
        <div class="login-box">
            <h2>Sign Up</h2>
            <form>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>
                <button type="submit">Sign Up</button>
                <p>Already have an account? <a href="Login.html">Login</a></p>
                <!-- <button class="social-login facebook">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook logo" />
                    Sign Up with Facebook
                </button>
                <button class="social-login google">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/87/Google_Chrome_icon_%282011%29.png" alt="Google Chrome logo" />
                    Sign Up with Google
                </button> -->
            </form>
        </div>
    </div>
</body>
</html>
